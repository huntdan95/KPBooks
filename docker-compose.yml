services:
  postgres:
    image: postgres:16
    container_name: kpbooks-postgres
    environment:
      POSTGRES_DB: kpbooks
      POSTGRES_USER: kpbooks
      POSTGRES_PASSWORD: kpbooks
    ports:
      - '5432:5432'
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
      # Creates the neondb_owner stand-in role that migration 0029 GRANTs to.
      # Only runs on a fresh volume — see the note inside the script.
      - ./infra/local-postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kpbooks -d kpbooks']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local Firestore + Auth emulators are run via `firebase emulators:start`,
  # not docker, because the Firebase CLI handles them better.
