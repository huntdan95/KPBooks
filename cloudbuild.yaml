# Cloud Build pipeline:
#   1. Install + typecheck + test the monorepo
#   2. Build the API container, push to Artifact Registry
#   3. Deploy to Cloud Run
#   4. Build the web app, deploy to Firebase Hosting
#
# Trigger: push to main on github.com/huntdan95/KPBooks
# Substitutions to set in the Cloud Build trigger:
#   _REGION         (e.g. us-central1)
#   _AR_REPO        (e.g. kpbooks)
#   _SERVICE        (e.g. kpbooks-api)
#   _CLOUDSQL_CONN  (e.g. kpbooks-91c48:us-central1:kpbooks)

steps:
  - name: 'gcr.io/cloud-builders/npm'
    id: install
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        pnpm install --frozen-lockfile

  - name: 'gcr.io/cloud-builders/npm'
    id: typecheck
    waitFor: ['install']
    entrypoint: 'bash'
    args: ['-c', 'pnpm typecheck']

  - name: 'gcr.io/cloud-builders/npm'
    id: test
    waitFor: ['install']
    entrypoint: 'bash'
    args: ['-c', 'pnpm test']

  - name: 'gcr.io/cloud-builders/docker'
    id: build-api
    waitFor: ['typecheck', 'test']
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: push-api
    waitFor: ['build-api']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-api
    waitFor: ['push-api']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=kpbooks-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=${_CLOUDSQL_CONN}'
      - '--set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets=DATABASE_URL=kpbooks-database-url:latest'

  - name: 'gcr.io/cloud-builders/npm'
    id: build-web
    waitFor: ['typecheck', 'test']
    entrypoint: 'bash'
    args: ['-c', 'pnpm --filter @kpbooks/web build']

  - name: 'gcr.io/$PROJECT_ID/firebase'
    id: deploy-web
    waitFor: ['build-web']
    args: ['deploy', '--only', 'hosting', '--project', '$PROJECT_ID']

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
