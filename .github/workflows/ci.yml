name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kpbooks
          POSTGRES_PASSWORD: kpbooks
          POSTGRES_DB: kpbooks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kpbooks -d kpbooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
        env:
          DATABASE_URL: postgres://kpbooks:kpbooks@localhost:5432/kpbooks
