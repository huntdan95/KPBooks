name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # No postgres service and no DATABASE_URL on purpose: the db test suite's
    # global-setup boots an embedded Postgres, applies every migration, and
    # creates the neondb_owner stand-in role that migration 0029 GRANTs to.
    # The old service-container path skipped migrations entirely (global-setup
    # returns early when DATABASE_URL is set) and had no neondb_owner, which
    # is why CI failed on every push since the RLS hard-fix. This path is
    # byte-for-byte what `pnpm test` does locally.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
