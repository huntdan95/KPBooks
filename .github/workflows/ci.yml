name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # No postgres service and no DATABASE_URL on purpose: the db test suite's
    # global-setup boots an embedded Postgres, applies every migration, and
    # creates the neondb_owner stand-in role that migration 0029 GRANTs to.
    # The old service-container path skipped migrations entirely (global-setup
    # returns early when DATABASE_URL is set) and had no neondb_owner, which
    # is why CI failed on every push since the RLS hard-fix. This path is
    # byte-for-byte what `pnpm test` does locally.
    steps:
      - uses: actions/checkout@v4

      # No explicit version: pnpm/action-setup reads the pinned pnpm from
      # package.json's packageManager field; specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Catches keys that exist in EN but not ES, mismatched {{vars}}, and
      # t() calls referencing a namespace the component never declared —
      # all of which render raw keys to the user but pass tsc.
      - run: pnpm check:i18n

      - run: pnpm test
