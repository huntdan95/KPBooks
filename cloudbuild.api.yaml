# Focused build+push+deploy pipeline for the API only.
# Trigger manually via:
#   gcloud builds submit --project=kpbooks-91c48 --config=cloudbuild.api.yaml .
#
# The full cloudbuild.yaml (typecheck + tests + web deploy) is wired up for
# CI on push-to-main once we want continuous deployment.

steps:
  # Apply DB migrations BEFORE deploying the new API revision. Runs in
  # parallel with the docker build; the deploy step waits for both. If
  # migrate fails, the build stops and the OLD revision keeps serving —
  # fail-closed, never new-code-on-old-schema. Requires the build service
  # account to have secretAccessor on kpbooks-database-url (see
  # infra/terraform/main.tf, cloudbuild_db_url / compute_default_db_url).
  - name: 'node:20'
    id: migrate
    waitFor: ['-']
    entrypoint: 'bash'
    secretEnv: ['DATABASE_URL']
    args:
      - '-c'
      - |
        set -euo pipefail
        corepack enable pnpm
        # --filter kpbooks includes the workspace root: the migrate script
        # runs via tsx, which is a root devDependency.
        pnpm install --frozen-lockfile --filter kpbooks --filter @kpbooks/db...
        pnpm --filter @kpbooks/db migrate

  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kpbooks/api:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kpbooks/api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: push
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/kpbooks/api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push', 'migrate']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'kpbooks-api'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/kpbooks/api:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=kpbooks-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=$PROJECT_ID,CORS_ORIGINS=https://$PROJECT_ID.web.app'
      - '--set-secrets=DATABASE_URL=kpbooks-database-url:latest,ANTHROPIC_API_KEY=kpbooks-anthropic-api-key:latest'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--port=8080'
      # 300s: commit-transactions posts IIF blocks sequentially against Neon,
      # so a large chunk needs headroom beyond 60s. The web client chunks big
      # imports (apps/web/src/lib/iif-commit.ts) because browser traffic goes
      # through the Firebase Hosting /v1 rewrite, which is capped at 60s by
      # the platform regardless of this flag; the raised timeout protects
      # direct API callers and slow chunks.
      - '--timeout=300'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kpbooks/api:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kpbooks/api:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/kpbooks-database-url/versions/latest
      env: 'DATABASE_URL'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
